version: '3.8'

services:
  voice-channel:
    build: .
    container_name: voice-channel-console
    ports:
      - "6891:6891"
    environment:
      - RC_URL=${ACLI_RC_URL:-http://host.docker.internal:3000}
      - RC_USER=${ACLI_RC_USER:-acli_bot}
      - RC_USER_ID=${ACLI_RC_USER_ID:-acli_bot}
      - RC_AUTH_TOKEN=${ACLI_RC_AUTH_TOKEN:-}
      - RC_ROOM_ID=${RC_ROOM_ID:-6a32407ea294f44649684786}
      # Dedicated Rocket.Chat identity used only for signed gateway dispatch.
      # Do not point these at acli_bot; missing values intentionally fail closed.
      - GATEWAY_RC_USER_ID=${GATEWAY_RC_USER_ID:-}
      - GATEWAY_RC_AUTH_TOKEN=${GATEWAY_RC_AUTH_TOKEN:-}
      - GATEWAY_RC_INGRESS_SECRET=${GATEWAY_RC_INGRESS_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VC_WORKER=${VC_WORKER:-codex}
      # Chatterbox stays on the Mac/server. The browser never receives this URL
      # or the model name; override this only when the Gateway runs in Docker.
      - VC_TTS_PROVIDER=${VC_TTS_PROVIDER:-chatterbox}
      # The Gateway runs in Linux here, so its fallback is the browser client;
      # native macOS `say` remains the fallback for a non-Docker Gateway.
      - VC_TTS_FALLBACK_PROVIDER=${VC_TTS_FALLBACK_PROVIDER:-browser}
      - VC_TTS_FALLBACK_VOICE=${VC_TTS_FALLBACK_VOICE:-Ava (Premium)}
      - VC_CHATTERBOX_URL=${VC_CHATTERBOX_URL:-http://host.docker.internal:8765}
      - VC_CHATTERBOX_MODEL=${VC_CHATTERBOX_MODEL:-mlx-community/chatterbox-turbo-8bit}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./acli:/app/acli
      - ./workers:/app/workers
      - ./tmp:/app/tmp
      - ./NORTH_STAR.md:/app/NORTH_STAR.md
      - ./OBJECTIVES.md:/app/OBJECTIVES.md
      - ./PROJECT_HANDOFF.md:/app/PROJECT_HANDOFF.md
      # Use the same live Codex home as the host and ACLI. Account switches update
      # auth.json in place and are visible to narrator subprocesses immediately.
      # This must be writable because Codex also records sessions and runtime state.
      - ${HOME}/.codex:/root/.codex
    restart: unless-stopped
